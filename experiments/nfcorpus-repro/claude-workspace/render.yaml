# Render Blueprint for the NFCorpus Live Retrieval Diagnostics Workbench.
#
# The container runs `/app/entrypoint.sh`, which boots:
#   - the Anserini RestServer on $ANSERINI_REST_PORT (internal, 8081 by default)
#   - a Flask reverse-proxy + dashboard on 0.0.0.0:$PORT
#
# Render sets PORT automatically; locally the entrypoint defaults to 10000.

services:
  - type: web
    name: nfcorpus-diagnostics
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: ANSERINI_REST_PORT
        value: "8081"
      - key: APP_CACHE_DIR
        value: /data
    disk:
      name: nfcorpus-cache
      mountPath: /data
      sizeGB: 1
